<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Image Audit Viewer</title>
<style>
  body { font-family: sans-serif; background: #222; color: #fff; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: #333; border-radius: 8px; padding: 10px; text-align: center; }
  img { max-width: 100%; height: 200px; object-fit: contain; background: #fff; border-radius: 4px; }
  h4 { margin: 8px 0 4px; font-size: 14px; }
</style>
</head>
<body>
<h1>فحص صور الإحماء والتهدئة المحملة</h1>
<div class="grid">
  <div class="card">
    <img src="Jogging_couple.jpg" alt="Jogging couple">
    <h4>Jogging_couple.jpg</h4>
  </div>
  <div class="card">
    <img src="Girl_exercising_shoulders.jpg" alt="Girl exercising shoulders">
    <h4>Girl_exercising_shoulders.jpg</h4>
  </div>
  <div class="card">
    <img src="Back_stretch_workout_session.jpg" alt="Back stretch">
    <h4>Back_stretch_workout_session.jpg</h4>
  </div>
  <div class="card">
    <img src="Squat-CDC_strength_training_for_older_adults.gif" alt="Squat CDC">
    <h4>Squat-CDC...gif</h4>
  </div>
  <div class="card">
    <img src="Chest_stretch-CDC_strength_training_for_older_adults.gif" alt="Chest CDC">
    <h4>Chest_stretch-CDC...gif</h4>
  </div>
  <div class="card">
    <img src="Backstretch-CDC_strength_training_for_older_adults.gif" alt="Backstretch CDC">
    <h4>Backstretch-CDC...gif</h4>
  </div>
  <div class="card">
    <img src="Hamstring_stretch-CDC_strength_training_for_older_adults.gif" alt="Hamstring CDC">
    <h4>Hamstring_stretch-CDC...gif</h4>
  </div>
  <div class="card">
    <img src="Quad_stretch-CDC_strength_training_for_older_adults.gif" alt="Quad CDC">
    <h4>Quad_stretch-CDC...gif</h4>
  </div>
</div>
</body>
</html>
