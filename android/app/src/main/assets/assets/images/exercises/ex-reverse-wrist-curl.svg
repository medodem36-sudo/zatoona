<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <style>
      @keyframes repMotion {
        0%, 35% { opacity: 1; }
        48%, 85% { opacity: 0; }
        98%, 100% { opacity: 1; }
      }
      .rep-start { animation: repMotion 2.4s ease-in-out infinite; }
    </style>
    <clipPath id="c"><rect width="300" height="200" rx="8"/></clipPath>
  </defs>
  <rect width="300" height="200" rx="8" fill="#111827"/>
  <g clip-path="url(#c)">
    <image href="data:image/jpeg;base64," width="300" height="200" preserveAspectRatio="xMidYMid slice"/>
    <image href="data:image/jpeg;base64," class="rep-start" width="300" height="200" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>