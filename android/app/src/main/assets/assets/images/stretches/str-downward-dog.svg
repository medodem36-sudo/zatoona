<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="وضعية الكلب المتجه لأسفل لإطالة السلسلة الخلفية للجسم">
  <defs>
    <linearGradient id="bgGrad-str-downward-dog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-downward-dog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-downward-dog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-downward-dog)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DYNAMIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-downward-dog" transform="translate(0, 0)">

    <!-- Male Athletic Downward-Facing Dog (Inverted V) -->
    <rect x="50" y="235" width="300" height="8" rx="2" fill="#1e293b"/>
    <!-- Hands Braced on Mat -->
    <circle cx="95" cy="235" r="5" fill="#64748b"/>
    <!-- Arms and Spine in Straight Line to Hips -->
    <path d="M95 235 L195 130" fill="none" stroke="url(#maleMuscles-str-downward-dog)" stroke-width="16" stroke-linecap="round"/>
    <!-- Inverted V Apex (Hips pushed to ceiling) -->
    <circle cx="195" cy="130" r="16" fill="url(#maleMuscles-str-downward-dog)"/>
    <!-- Head relaxed between upper arms -->
    <ellipse cx="125" cy="200" rx="13" ry="13" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <!-- Straight Legs to Heels on Floor -->
    <path d="M195 130 L285 235" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <!-- Target Calves & Posterior Chain Glow -->
    <path d="M210 145 L275 225" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.9" filter="url(#glow-str-downward-dog)"/>
    <!-- Motion Vector directing energy up and back -->
    <path d="M175 160 L195 135" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="198,130 190,136 198,142" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>