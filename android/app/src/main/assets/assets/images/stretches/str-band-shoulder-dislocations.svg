<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="دوران الكتفين بشريط المقاومة لتحسين المرونة">
  <defs>
    <linearGradient id="bgGrad-str-band-shoulder-dislocations" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-band-shoulder-dislocations" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-band-shoulder-dislocations" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-band-shoulder-dislocations)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">JOINT MOBILITY</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-band-shoulder-dislocations" transform="translate(0, 0)">

    <!-- Male Athletic Silhouette Cross-Body or Pass-Through Shoulder Movement -->
    <!-- Head -->
    <ellipse cx="200" cy="80" rx="14" ry="17" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <rect x="195" y="95" width="10" height="12" fill="#475569"/>
    <!-- Broad V-Taper Torso -->
    <path d="M175 107 L225 107 L212 175 L188 175 Z" fill="url(#maleMuscles-str-band-shoulder-dislocations)" stroke="#64748b" stroke-width="2"/>
    <!-- Target Shoulder Highlight -->
    <circle cx="225" cy="118" r="12" fill="#f59e0b" opacity="0.9" filter="url(#glow-str-band-shoulder-dislocations)"/>
    <!-- Arm crossing torso horizontally -->
    <path d="M225 118 L140 125" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <!-- Supporting Hand pulling elbow -->
    <path d="M170 160 L160 120" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Dynamic Force Vector -->
    <path d="M155 112 Q145 125 155 138" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <!-- Legs Stance -->
    <path d="M190 175 L180 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <path d="M210 175 L220 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>