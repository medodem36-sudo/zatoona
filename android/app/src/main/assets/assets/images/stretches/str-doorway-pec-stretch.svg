<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="إطالة عضلات الصدر عند إطار الباب">
  <defs>
    <linearGradient id="bgGrad-str-doorway-pec-stretch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-doorway-pec-stretch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-doorway-pec-stretch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-doorway-pec-stretch)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-doorway-pec-stretch" transform="translate(0, 0)">

    <!-- Wall / Doorway frame -->
    <rect x="280" y="50" width="16" height="190" rx="2" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <rect x="270" y="45" width="36" height="10" rx="2" fill="#334155"/>
    <!-- Male Athletic Silhouette Standing Chest Stretch -->
    <!-- Head with masculine short jawline -->
    <ellipse cx="195" cy="85" rx="14" ry="17" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <!-- Neck -->
    <rect x="190" y="100" width="10" height="12" fill="#475569"/>
    <!-- Muscular Torso angled away -->
    <path d="M175 112 L215 112 L208 175 L182 175 Z" fill="url(#maleMuscles-str-doorway-pec-stretch)" stroke="#64748b" stroke-width="2"/>
    <!-- Highlighted Pecs (Target) -->
    <path d="M180 118 Q195 135 210 118 Q205 142 185 142 Z" fill="#f59e0b" opacity="0.85" filter="url(#glow-str-doorway-pec-stretch)"/>
    <!-- Arm on doorway bent at 90 deg -->
    <path d="M215 118 Q250 115 265 115 L280 115 L280 80" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="280" cy="80" r="6" fill="#64748b"/>
    <!-- Free arm -->
    <path d="M175 118 Q165 145 168 175" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <!-- Legs in split lunge stance -->
    <path d="M185 175 L170 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <path d="M205 175 L225 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <!-- Stretch arrow vector -->
    <path d="M165 130 Q150 135 145 150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,2"/>
    <polygon points="142,152 150,147 145,142" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>