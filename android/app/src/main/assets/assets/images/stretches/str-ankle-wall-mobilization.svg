<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="تمرين مرونة حركة مفصل الكاحل للأمام على الحائط">
  <defs>
    <linearGradient id="bgGrad-str-ankle-wall-mobilization" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-ankle-wall-mobilization" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-ankle-wall-mobilization" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-ankle-wall-mobilization)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">JOINT MOBILITY</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-ankle-wall-mobilization" transform="translate(0, 0)">

    <!-- Male Athletic Calf & Ankle Wall Mobility Stretch -->
    <!-- Wall Structure -->
    <rect x="80" y="50" width="14" height="190" rx="2" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <!-- Hands on wall -->
    <circle cx="96" cy="120" r="6" fill="#64748b"/>
    <!-- Arms bracing on wall -->
    <path d="M96 120 L160 125" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Torso inclined -->
    <path d="M160 125 L210 160" fill="none" stroke="url(#maleMuscles-str-ankle-wall-mobilization)" stroke-width="20" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="155" cy="100" rx="14" ry="16" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <!-- Front Leg Bent towards wall -->
    <path d="M205 160 L140 190 L135 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <!-- Rear Leg Stretched Back Flat Heel -->
    <path d="M215 160 L260 195 L275 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <!-- Target Calf / Gastrocnemius / Soleus Glow -->
    <path d="M255 190 L270 225" fill="none" stroke="#f59e0b" stroke-width="9" opacity="0.95" filter="url(#glow-str-ankle-wall-mobilization)"/>
    <!-- Force vector driving heel down -->
    <path d="M285 210 L285 235" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="285,238 281,230 289,230" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>