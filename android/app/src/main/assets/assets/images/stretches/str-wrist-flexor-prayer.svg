<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="استطالة عاطفات الرسغ وباطن الساعد بوضعية الضم">
  <defs>
    <linearGradient id="bgGrad-str-wrist-flexor-prayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-wrist-flexor-prayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-wrist-flexor-prayer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-wrist-flexor-prayer)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-wrist-flexor-prayer" transform="translate(0, 0)">

    <!-- Male Athletic Forearm & Wrist Mobility Articulation -->
    <!-- Forearm Profile with Muscular Contour -->
    <path d="M110 160 Q160 152 230 155 L230 175 Q160 180 110 170 Z" fill="url(#maleMuscles-str-wrist-flexor-prayer)" stroke="#64748b" stroke-width="2"/>
    <!-- Highlighted Forearm Flexors/Extensors -->
    <path d="M130 156 Q170 153 215 157 L215 172 Q170 176 130 169 Z" fill="#f59e0b" opacity="0.9" filter="url(#glow-str-wrist-flexor-prayer)"/>
    <!-- Articulating Hand / Fingers in stretch position -->
    <path d="M230 155 L255 135 L275 130" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="165" r="7" fill="#475569"/>
    <!-- Opposite hand applying light guidance -->
    <path d="M260 110 L260 145" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
    <!-- Gentle stretch directional arc -->
    <path d="M275 145 Q265 160 250 165" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,2"/>
    <polygon points="248,166 256,164 253,158" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>