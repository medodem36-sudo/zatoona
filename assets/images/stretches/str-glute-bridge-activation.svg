<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="تنشيط عضلات الإلية بجسر الحوض بوزن الجسم">
  <defs>
    <linearGradient id="bgGrad-str-glute-bridge-activation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-glute-bridge-activation" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-glute-bridge-activation" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-glute-bridge-activation)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVATION</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-glute-bridge-activation" transform="translate(0, 0)">

    <!-- Male Athletic Glute Bridge Activation (Lying on Mat) -->
    <rect x="50" y="235" width="300" height="8" rx="2" fill="#1e293b"/>
    <!-- Feet flat on floor -->
    <path d="M100 235 L125 180" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <!-- Elevated Hips and Contracted Glutes -->
    <ellipse cx="155" cy="165" rx="18" ry="14" fill="#f59e0b" opacity="0.95" filter="url(#glow-str-glute-bridge-activation)"/>
    <!-- Straight Torso from Knees to Shoulders -->
    <path d="M130 180 L220 215" fill="none" stroke="url(#maleMuscles-str-glute-bridge-activation)" stroke-width="20" stroke-linecap="round"/>
    <!-- Shoulders and Head on floor -->
    <ellipse cx="250" cy="225" rx="15" ry="13" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <!-- Arms by side -->
    <path d="M220 220 L160 230" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Upward contraction vector -->
    <path d="M155 195 L155 150" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="155,145 150,154 160,154" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>