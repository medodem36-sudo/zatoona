<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="استطالة الفراشة جالسًا للعضلات الضامة وباطن الفخذ">
  <defs>
    <linearGradient id="bgGrad-str-butterfly-stretch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-butterfly-stretch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-butterfly-stretch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-butterfly-stretch)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-butterfly-stretch" transform="translate(0, 0)">

    <!-- Male 90/90 or Seated Butterfly Hip Mobility -->
    <rect x="60" y="235" width="280" height="8" rx="2" fill="#1e293b"/>
    <!-- Seated Pelvis Base -->
    <ellipse cx="200" cy="205" rx="26" ry="16" fill="url(#maleMuscles-str-butterfly-stretch)" stroke="#64748b" stroke-width="2"/>
    <!-- Upright / Incline Spine -->
    <path d="M200 205 L200 120" fill="none" stroke="url(#maleMuscles-str-butterfly-stretch)" stroke-width="20" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="200" cy="90" rx="14" ry="16" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <!-- Target Groin / Hip Capsule Highlight -->
    <circle cx="200" cy="205" r="16" fill="#f59e0b" opacity="0.85" filter="url(#glow-str-butterfly-stretch)"/>
    <!-- Legs folded outwards (Butterfly / 90-90) -->
    <path d="M185 210 Q140 215 130 235 L190 235" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <path d="M215 210 Q260 215 270 235 L210 235" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <!-- Downward mobility vectors -->
    <path d="M140 200 L140 220" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="140,224 136,216 144,216" fill="#38bdf8"/>
    <path d="M260 200 L260 220" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="260,224 256,216 264,216" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>