<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="وضعية الطفل الممتدة لإراحة الظهر والعمود الفقري">
  <defs>
    <linearGradient id="bgGrad-str-childs-pose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-childs-pose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-childs-pose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-childs-pose)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-childs-pose" transform="translate(0, 0)">

    <!-- Male Athletic Silhouette in Extended Child's Pose (On Mat) -->
    <!-- Exercise Mat -->
    <rect x="50" y="235" width="300" height="8" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Folded Legs/Hips seated on heels -->
    <ellipse cx="280" cy="215" rx="28" ry="18" fill="url(#maleMuscles-str-childs-pose)" stroke="#64748b" stroke-width="2"/>
    <path d="M295 225 L255 235 L220 235" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <!-- Torso extended forward along floor -->
    <path d="M260 210 Q200 195 150 215" fill="none" stroke="url(#maleMuscles-str-childs-pose)" stroke-width="22" stroke-linecap="round"/>
    <!-- Target Latissimus & Lower Back Highlight -->
    <path d="M245 202 Q190 190 150 205" fill="none" stroke="#f59e0b" stroke-width="7" opacity="0.9" filter="url(#glow-str-childs-pose)"/>
    <!-- Extended Arms stretched forward flat on mat -->
    <path d="M150 215 L85 230" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="80" cy="232" r="5" fill="#64748b"/>
    <!-- Head rested downward -->
    <ellipse cx="140" cy="222" rx="13" ry="11" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <!-- Stretch arrows -->
    <path d="M210 180 L180 180" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <polygon points="175,180 183,176 183,184" fill="#38bdf8"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>