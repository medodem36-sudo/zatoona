<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="استطالة الكوبرا لأسفل الظهر وعضلات البطن">
  <defs>
    <linearGradient id="bgGrad-str-cobra-lumbar-stretch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-cobra-lumbar-stretch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-cobra-lumbar-stretch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-cobra-lumbar-stretch)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-cobra-lumbar-stretch" transform="translate(0, 0)">

    <!-- Male Athletic Prone Cobra Lumbar Extension -->
    <rect x="50" y="235" width="300" height="8" rx="2" fill="#1e293b"/>
    <!-- Legs Extended Flat on Mat -->
    <path d="M200 230 L310 235" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <!-- Pelvis on Mat with gentle spine lift -->
    <ellipse cx="195" cy="225" rx="18" ry="12" fill="url(#maleMuscles-str-cobra-lumbar-stretch)"/>
    <!-- Arching Torso Supported by Arms -->
    <path d="M195 225 Q160 190 120 150" fill="none" stroke="url(#maleMuscles-str-cobra-lumbar-stretch)" stroke-width="20" stroke-linecap="round"/>
    <!-- Hands pressing lightly under shoulders -->
    <path d="M135 170 L115 235" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <!-- Target Abdominal Wall & Lumbar Curve Glow -->
    <path d="M190 220 Q160 185 125 155" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.9" filter="url(#glow-str-cobra-lumbar-stretch)"/>
    <!-- Head Extended Looking Gently Forward/Up -->
    <ellipse cx="110" cy="130" rx="14" ry="16" fill="#475569" stroke="#64748b" stroke-width="2"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>