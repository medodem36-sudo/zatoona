<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="إطالة عضلات الفخذ الخلفية واقفًا مع رفع مشط القدم">
  <defs>
    <linearGradient id="bgGrad-str-standing-hamstring-stretch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-standing-hamstring-stretch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-standing-hamstring-stretch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-standing-hamstring-stretch)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-standing-hamstring-stretch" transform="translate(0, 0)">

    <!-- Male Athletic Standing Hamstring Stretch (Hips Pushed Back) -->
    <!-- Rear Bent Leg -->
    <path d="M225 160 L240 195 L235 240" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <!-- Front Extended Leg with Heel on Ground & Toe Up -->
    <path d="M215 160 L160 215 L145 238" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <!-- Toe pointed up -->
    <path d="M145 238 L140 225" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <!-- Target Hamstring Highlight Zone -->
    <path d="M210 165 L165 210" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.9" filter="url(#glow-str-standing-hamstring-stretch)"/>
    <!-- Torso Hinged Forward with Flat Back -->
    <path d="M220 160 L170 120" fill="none" stroke="url(#maleMuscles-str-standing-hamstring-stretch)" stroke-width="20" stroke-linecap="round"/>
    <!-- Head in line with spine -->
    <ellipse cx="155" cy="110" rx="14" ry="16" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <!-- Hands resting on thighs -->
    <path d="M175 125 L195 165" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>