<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="تنشيط استقرار العمود الفقري وعضلات الجذع (تمرين الطائر والكلب)">
  <defs>
    <linearGradient id="bgGrad-str-bird-dog-activation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-bird-dog-activation" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-bird-dog-activation" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-bird-dog-activation)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVATION</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-bird-dog-activation" transform="translate(0, 0)">

    <!-- Male Athletic Quadruped Spine Stabilization / Rotation Drill -->
    <rect x="50" y="235" width="300" height="8" rx="2" fill="#1e293b"/>
    <!-- Supporting Arm and Leg -->
    <path d="M170 170 L170 235" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <path d="M225 170 L225 235" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <!-- Horizontal Torso / Core Core Cylinder -->
    <path d="M150 165 L240 165" fill="none" stroke="url(#maleMuscles-str-bird-dog-activation)" stroke-width="20" stroke-linecap="round"/>
    <!-- Target Core / Spine Stabilizer Glow -->
    <path d="M160 165 L230 165" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.9" filter="url(#glow-str-bird-dog-activation)"/>
    <!-- Extended Arm Forward (Bird Dog / Thoracic) -->
    <path d="M150 165 L85 160" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <!-- Extended Leg Backward Horizontal -->
    <path d="M240 165 L315 165" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <!-- Head in neutral alignment -->
    <ellipse cx="140" cy="150" rx="14" ry="14" fill="#475569" stroke="#64748b" stroke-width="2"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>