<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="إطالة عضلات المجنص (اللاتس) على الحائط">
  <defs>
    <linearGradient id="bgGrad-str-lat-wall-stretch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="maleMuscles-str-lat-wall-stretch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow-str-lat-wall-stretch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad-str-lat-wall-stretch)"/>

  <!-- Gym floor grid lines for spatial reference -->
  <line x1="30" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="240" r="3" fill="#64748b"/>

  <!-- Target Muscle Highlight Indicator Banner -->
  <rect x="24" y="20" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="36" cy="32" r="4" fill="#f59e0b"/>
  <text x="46" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC STRETCH</text>

  <!-- Male Athletic Figure Group -->
  <g id="maleFigure-str-lat-wall-stretch" transform="translate(0, 0)">

    <!-- Male Athletic Lat Wall Stretch (Hinged at Hips) -->
    <!-- Wall Reference -->
    <rect x="70" y="60" width="14" height="180" rx="2" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <!-- Hands on wall -->
    <circle cx="86" cy="130" r="6" fill="#64748b"/>
    <!-- Arms reaching to wall -->
    <path d="M86 130 L160 135" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
    <!-- Head between arms -->
    <ellipse cx="150" cy="140" rx="12" ry="14" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    <!-- Torso hinged horizontally -->
    <path d="M160 135 L240 145" fill="none" stroke="url(#maleMuscles-str-lat-wall-stretch)" stroke-width="20" stroke-linecap="round"/>
    <!-- Lat Highlight Zone -->
    <path d="M170 132 L230 140" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.9" filter="url(#glow-str-lat-wall-stretch)"/>
    <!-- Hips and Glutes pushed back -->
    <circle cx="245" cy="148" r="16" fill="url(#maleMuscles-str-lat-wall-stretch)"/>
    <!-- Legs with soft knee bend -->
    <path d="M245 155 L255 195 L250 240" fill="none" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <path d="M235 155 L230 195 L225 240" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>

  </g>

  <!-- Clean Descriptive Watermark Badge -->
  <text x="375" y="278" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="500">ZATOONA MOBILITY</text>
  <text x="24" y="278" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="500">STRICT MALES-ONLY VECTOR</text>
</svg>