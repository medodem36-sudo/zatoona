      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e3f0fd"/>
    </linearGradient>
    <linearGradient id="maleGradC4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
