<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="50%" stop-color="#164436"/>
      <stop offset="100%" stop-color="#0F3026"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="240" y1="130" x2="380" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="oliveGrad" x1="180" y1="230" x2="280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="55%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#34D399" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Emblem Group centered inside 80% safe zone -->
  <g filter="url(#shadow)" transform="translate(8, 4)">
    <!-- Main stem / checkmark flow (growth and daily completion) -->
    <path d="M162 348 C 205 320, 245 270, 275 200 C 285 175, 290 150, 292 135"
          fill="none" stroke="#FAF9F6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Secondary small stem to olive -->
    <path d="M225 285 C 205 285, 185 295, 175 315"
          fill="none" stroke="#FAF9F6" stroke-width="11" stroke-linecap="round"/>

    <!-- Primary Top Leaf (Large curved, vibrant green) -->
    <path d="M288 140 C 310 170, 375 190, 380 230 C 345 255, 275 235, 260 195 C 255 180, 270 155, 288 140 Z"
          fill="url(#leafGrad)"/>
    <!-- Leaf Spine -->
    <path d="M284 150 C 300 185, 335 215, 365 225"
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Secondary Side Leaf (Off-white / pale sage) -->
    <path d="M265 210 C 230 185, 175 180, 145 205 C 170 235, 220 240, 255 225 Z"
          fill="#FAF9F6" fill-opacity="0.95"/>
    <path d="M255 212 C 220 200, 185 202, 160 210"
          fill="none" stroke="#1B4D3E" stroke-width="3" stroke-linecap="round" stroke-opacity="0.35"/>

    <!-- Main Olive (Friendly, plump, warm golden-olive) -->
    <g transform="translate(210, 310) rotate(-22)">
      <ellipse cx="0" cy="0" rx="54" ry="72" fill="url(#oliveGrad)"/>
      <!-- Soft Specular Reflection -->
      <ellipse cx="-16" cy="-22" rx="18" ry="32" fill="#FFFFFF" fill-opacity="0.4" transform="rotate(-10)"/>
    </g>

    <!-- Golden Spark of morning clarity -->
    <circle cx="348" cy="155" r="8" fill="#FDE047"/>
  </g>
</svg>